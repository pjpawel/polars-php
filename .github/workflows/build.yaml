name: Build PHP Extension

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build - ${{ matrix.os }} - PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.3', '8.4', '8.5', '8.6']
        include:
          - os: ubuntu-latest
            extension: so
            rust-target: x86_64-unknown-linux-gnu
            rust-toolchain: stable
          - os: windows-latest
            extension: dll
            rust-target: x86_64-pc-windows-msvc
            rust-toolchain: nightly
          - os: macos-latest
            extension: dylib
            rust-target: x86_64-apple-darwin
            rust-toolchain: stable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          tools: none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-php${{ matrix.php }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-cargo-

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang
          echo "CFLAGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      - name: Build extension (Linux/macOS)
        if: runner.os != 'Windows'
        run: cargo build --release

      - name: Build extension (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release
        env:
          RUSTFLAGS: -C target-feature=+crt-static

      - name: Find built extension
        id: find-extension
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            EXT_PATH=$(find target/release -maxdepth 1 -name "*.dll" | head -n 1)
          elif [ "${{ runner.os }}" == "macOS" ]; then
            EXT_PATH=$(find target/release -maxdepth 1 -name "*.dylib" | head -n 1)
          else
            EXT_PATH=$(find target/release -maxdepth 1 -name "*.so" | head -n 1)
          fi
          echo "extension_path=$EXT_PATH" >> $GITHUB_OUTPUT
          echo "Found extension: $EXT_PATH"

      - name: Test extension loading
        shell: bash
        run: |
          php -d extension=${{ steps.find-extension.outputs.extension_path }} -m

      - name: Detect platform tokens for PIE asset naming
        id: tokens
        shell: bash
        run: |
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64|AMD64) ARCH=x86_64 ;;
            aarch64|arm64) ARCH=arm64 ;;
          esac
          case "${{ runner.os }}" in
            Linux)   OS=linux;  LIBC=$(ldd --version 2>/dev/null | grep -qi musl && echo musl || echo glibc) ;;
            macOS)   OS=darwin; LIBC=bsdlibc ;;
            Windows) OS=windows; LIBC='' ;;
          esac
          if php -i | grep -i '^Thread Safety' | grep -qi enabled; then TS=zts; else TS=nts; fi
          if php -i | grep -i '^Debug Build' | grep -qi 'yes'; then DEBUG=debug; else DEBUG=''; fi
          COMPILER=''
          if [ "$OS" = "windows" ]; then
            COMPILER=$(php -i | grep -oE 'PHP Extension Build => [^,]*,[^,]*,VS[0-9]+' | grep -oE 'VS[0-9]+' | tr 'A-Z' 'a-z')
          fi
          {
            echo "arch=$ARCH"
            echo "os=$OS"
            echo "libc=$LIBC"
            echo "ts=$TS"
            echo "debug=$DEBUG"
            echo "compiler=$COMPILER"
          } >> "$GITHUB_OUTPUT"
          echo "Tokens: os=$OS arch=$ARCH libc=$LIBC ts=$TS debug=$DEBUG compiler=$COMPILER"

      - name: Prepare distribution artifact
        shell: bash
        run: |
          mkdir -p dist
          EXT_NAME=$(basename ${{ steps.find-extension.outputs.extension_path }})
          BASE_NAME="${EXT_NAME%.*}"
          NEW_NAME="${BASE_NAME}-php${{ matrix.php }}-${{ matrix.os }}.${{ matrix.extension }}"
          cp "${{ steps.find-extension.outputs.extension_path }}" "dist/$NEW_NAME"
          echo "ARTIFACT_NAME=$NEW_NAME" >> $GITHUB_ENV
          {
            echo "binary=$NEW_NAME"
            echo "php=${{ matrix.php }}"
            echo "os=${{ steps.tokens.outputs.os }}"
            echo "arch=${{ steps.tokens.outputs.arch }}"
            echo "libc=${{ steps.tokens.outputs.libc }}"
            echo "ts=${{ steps.tokens.outputs.ts }}"
            echo "debug=${{ steps.tokens.outputs.debug }}"
            echo "compiler=${{ steps.tokens.outputs.compiler }}"
          } > dist/build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.os }}-php${{ matrix.php }}
          path: dist/
          retention-days: 30

  pie-build:
    name: PIE build - ubuntu-latest - PHP 8.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # PIE's PHAR requires mbstring or iconv to be loaded in the CLI PHP
          extensions: mbstring
          tools: none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-php8.4-pie-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.4-pie-cargo-

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang
          echo "CFLAGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Download PIE
        run: curl -fL --output pie.phar https://github.com/php/pie/releases/latest/download/pie.phar

      - name: Register this repository as a PIE path repository
        run: php pie.phar repository:add path .

      - name: Build the extension with PIE
        run: php pie.phar build 'pjpawel/polars-php:*@dev'

      - name: Verify the PIE-built extension loads
        shell: bash
        run: |
          SO=$(find ~/.config/pie "$GITHUB_WORKSPACE" -name 'polars.so' -path '*modules*' 2>/dev/null | head -n 1)
          echo "PIE-built extension: $SO"
          test -n "$SO"
          php -d extension="$SO" -m | grep -i polars
          php -d extension="$SO" -r 'var_dump(extension_loaded("polars"));'

  generate-stubs:
    name: Generate PHP Stubs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: none

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stubs-${{ hashFiles('**/Cargo.lock') }}

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang
          echo "CFLAGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS=-flax-vector-conversions" >> $GITHUB_ENV
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> $GITHUB_ENV

      - name: Install cargo-php tool
        run: |
          cargo install cargo-php || true

      - name: Generate stubs
        run: |
          cargo php stubs --stdout > stubs.php || echo "<?php\n// Stubs generation failed\n" > stubs.php

      - name: Verify stubs file
        run: |
          if [ -s stubs.php ]; then
            echo "Stubs generated successfully"
            head -n 20 stubs.php
          else
            echo "Warning: Stubs file is empty"
          fi

      - name: Upload stubs
        uses: actions/upload-artifact@v7
        with:
          name: php-stubs
          path: stubs.php
          retention-days: 90

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, generate-stubs, benchmark]
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Create release archives
        run: |
          cd artifacts
          for dir in extension-*; do
            if [ -d "$dir" ]; then
              cd "$dir"
              for file in *; do
                [ -f "$file" ] || continue
                zip "../${file}.zip" "$file"
              done
              cd ..
            fi
          done

      # PIE (pre-packaged-binary) asset names, lowercased by PIE when matching:
      #   Unix:    php_polars-{tag}_php{majmin}-{arch}-{os}-{libc}[-debug]-{nts|zts}.zip
      #            containing polars.so at the zip root
      #   Windows: php_polars-{tag}-{majmin}-{nts|ts}-{compiler}-{arch}.zip
      #            containing php_polars-{tag}-{majmin}-{nts|ts}-{compiler}-{arch}.dll at the zip root
      - name: Create PIE prebuilt binary assets
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Release tag (PIE version token): $TAG"
          mkdir -p pie-assets
          cd artifacts
          for dir in extension-*; do
            [ -d "$dir" ] || continue
            info="$dir/build-info.txt"
            [ -f "$info" ] || continue
            # shellcheck disable=SC1090
            source "$info"
            EXT_FILE=$(find "$dir" -maxdepth 1 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) | head -n 1)
            [ -n "$EXT_FILE" ] || { echo "No binary in $dir, skipping"; continue; }
            stage="../pie-assets/$dir"
            mkdir -p "$stage"
            if [ "$os" = "windows" ]; then
              BASE="php_polars-${TAG}-${php}-${ts}-${compiler}-${arch}"
              cp "$EXT_FILE" "$stage/${BASE}.dll"
              (cd "$stage" && zip "${BASE}.zip" "${BASE}.dll")
              echo "Created $stage/${BASE}.zip"
            else
              DEBUG_SUFFIX=""; [ -n "$debug" ] && DEBUG_SUFFIX="-${debug}"
              BASE="php_polars-${TAG}_php${php}-${arch}-${os}-${libc}${DEBUG_SUFFIX}-${ts}"
              cp "$EXT_FILE" "$stage/polars.so"
              (cd "$stage" && zip "${BASE}.zip" polars.so)
              echo "Created $stage/${BASE}.zip"
            fi
          done
          cd ..
          ls -la pie-assets/*/

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*.zip
            pie-assets/*/*.zip
            artifacts/php-stubs/stubs.php
            artifacts/benchmark-results/results.xml
            artifacts/benchmark-results/comparison.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Extension - ${{ matrix.os }} - PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ['8.3', '8.4', '8.5', '8.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Download extension artifact
        uses: actions/download-artifact@v5
        with:
          name: extension-${{ matrix.os }}-php${{ matrix.php }}
          path: extension

      - name: Run tests
        shell: bash
        run: |
          EXT_FILE=$(realpath $(find extension -type f \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" \) | head -n 1))
          echo "Testing extension: $EXT_FILE"
          php -d extension="$EXT_FILE" -m

          # Use the self-contained PHPUnit phar instead of `composer install`:
          # php/composer.lock pins symfony/* v8 (via phpbench), which requires
          # PHP >= 8.4, so composer install fails on the PHP 8.3 jobs.
          cd php
          curl -sSL -o phpunit.phar https://phar.phpunit.de/phpunit-12.phar
          php -d extension="$EXT_FILE" phpunit.phar tests

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Download extension artifact
        uses: actions/download-artifact@v5
        with:
          name: extension-ubuntu-latest-php8.4
          path: extension

      - name: Place extension for phpbench
        run: |
          mkdir -p target/release
          EXT_FILE=$(find extension -type f -name "*.so" | head -n 1)
          echo "Found extension: $EXT_FILE"
          cp "$EXT_FILE" target/release/libpolars_php.so
          php -d extension=target/release/libpolars_php.so -m | grep -i polars

      - name: Install dependencies
        run: |
          cd php
          composer install --no-interaction

      - name: Run benchmarks
        run: |
          cd php
          vendor/bin/phpbench run --config=benchmarks/phpbench.json --report=default --dump-file=benchmarks/results.xml

      - name: Generate comparison report
        run: |
          cd php
          php benchmarks/compare-report.php benchmarks/results.xml | tee benchmarks/comparison.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            php/benchmarks/results.xml
            php/benchmarks/comparison.md
          retention-days: 90